<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Brief</title>
<meta name="description" content="Daily US stock market morning brief: futures, movers, leveraged ETFs and earnings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens ---------- */
  :root {
    --bg: #0D1220;
    --panel: #141B2D;
    --line: #24304A;
    --text: #E7EBF3;
    --muted: #8C96AD;
    --up: #4FD1B5;
    --down: #FF7D8E;
    --accent: #A59BFF;
    --axis-glow: rgba(165, 155, 255, 0.55);
    --warn: #F5C66B;
    --radius-lg: 14px;
    --radius-sm: 6px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F2F4F9; --panel: #FFFFFF; --line: #D9DEEA; --text: #121829;
      --muted: #5B647A; --up: #0B8A6F; --down: #C93A52; --accent: #5B4CD6;
      --axis-glow: rgba(91, 76, 214, 0.35); --warn: #9A6A00;
    }
  }
  :root[data-theme="light"] {
    --bg: #F2F4F9; --panel: #FFFFFF; --line: #D9DEEA; --text: #121829;
    --muted: #5B647A; --up: #0B8A6F; --down: #C93A52; --accent: #5B4CD6;
    --axis-glow: rgba(91, 76, 214, 0.35); --warn: #9A6A00;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Geist", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Top bar ---------- */
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 20px 0; border-bottom: 1px solid var(--line);
  }
  .mark { font-weight: 600; letter-spacing: -0.01em; font-size: 16px; }
  .mark span { color: var(--muted); font-weight: 400; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .pill {
    font-size: 13px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--accent); color: var(--accent);
  }
  select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 6px 8px; font: inherit; font-size: 13px;
  }

  /* ---------- Hero ---------- */
  .hero { padding: 40px 0 24px; }
  .date { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  h1 {
    font-weight: 300; font-size: clamp(26px, 4.2vw, 42px);
    line-height: 1.15; letter-spacing: -0.025em; margin: 0; max-width: 24ch;
  }
  .asof { color: var(--muted); font-size: 13px; margin-top: 14px; }

  /* Signature element: the zero line */
  .field {
    position: relative; margin-top: 32px;
    border: 1px solid var(--line); border-radius: var(--radius-lg);
    background: var(--panel); padding: 8px 0;
  }
  .frow {
    display: grid; grid-template-columns: minmax(130px, 1.1fr) minmax(90px, 0.7fr) 118px 2.2fr 70px;
    align-items: center; gap: 12px; padding: 9px 20px;
  }
  .frow + .frow { border-top: 1px solid var(--line); }
  .fname { font-size: 14px; }
  .flevel { font-size: 14px; color: var(--muted); text-align: right; }
  .fpct { text-align: right; font-size: 14px; font-weight: 500; }

  /* Reading tags with tooltips */
  .tagwrap { position: relative; justify-self: start; }
  .tag {
    font: inherit; font-size: 12px; line-height: 1; padding: 5px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: help;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .tag.t-calm { color: var(--muted); }
  .tag.t-watch { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .tag.t-alert { color: var(--down); border-color: color-mix(in srgb, var(--down) 50%, transparent); }
  .tip {
    position: absolute; z-index: 20; left: 0; top: calc(100% + 8px); width: 280px;
    background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-size: 13px; line-height: 1.45; box-shadow: 0 12px 32px rgba(0,0,0,.35);
    opacity: 0; visibility: hidden; transform: translateY(-4px);
    transition: opacity .12s ease, transform .12s ease, visibility .12s;
  }
  .tip b { display: block; font-weight: 500; margin-bottom: 4px; }
  .tip .why { display: block; color: var(--muted); margin-top: 6px; }
  .tagwrap:hover .tip, .tag:focus + .tip { opacity: 1; visibility: visible; transform: none; }
  .frow:nth-last-child(-n+3) .tip { top: auto; bottom: calc(100% + 8px); }
  @media (prefers-reduced-motion: reduce) { .tip { transition: none; } }
  .track { position: relative; height: 18px; }
  .track::before { /* the axis, drawn per row so it reads as one continuous line */
    content: ""; position: absolute; left: 50%; top: -10px; bottom: -10px; width: 1px;
    background: var(--accent); box-shadow: 0 0 10px var(--axis-glow);
  }
  .bar { position: absolute; top: 5px; height: 8px; border-radius: 4px; }
  .bar.up { left: 50%; background: var(--up); }
  .bar.down { right: 50%; background: var(--down); }
  .bar.na { left: calc(50% - 14px); width: 28px; background: none; border: 1px dashed var(--muted); height: 8px; }
  .up-t { color: var(--up); } .down-t { color: var(--down); } .flat-t { color: var(--muted); }

  .closes { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 14px; color: var(--muted); font-size: 13px; }
  .closes b { color: var(--text); font-weight: 500; }

  /* ---------- Context ---------- */
  .context { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; padding: 32px 0; border-top: 1px solid var(--line); }
  h2 { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; margin: 0 0 14px; }
  .prose { max-width: 66ch; margin: 0; color: var(--text); }
  .timeline { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
  .timeline li { position: relative; padding: 0 0 14px 18px; }
  .timeline li::before {
    content: ""; position: absolute; left: -4px; top: 7px; width: 7px; height: 7px;
    border-radius: 50%; background: var(--panel); border: 1px solid var(--accent);
  }
  .t-time { font-size: 13px; color: var(--muted); }
  .t-event { font-size: 14px; }
  .t-detail { font-size: 13px; color: var(--muted); }

  /* ---------- Tabs ---------- */
  .tabs-section { padding: 8px 0 32px; border-top: 1px solid var(--line); }
  [role="tablist"] {
    display: flex; gap: 4px; overflow-x: auto; padding: 20px 0 16px; scrollbar-width: none;
  }
  [role="tab"] {
    flex: 0 0 auto; font: inherit; font-size: 14px; color: var(--muted);
    background: none; border: 1px solid transparent; border-radius: 999px;
    padding: 6px 14px; cursor: pointer;
  }
  [role="tab"][aria-selected="true"] { color: var(--text); border-color: var(--accent); }
  [role="tab"]:hover { color: var(--text); }
  [role="tabpanel"] { animation: none; }
  .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .stack { display: grid; gap: 20px; }
  .block { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
  .block h3 { font-size: 15px; font-weight: 500; margin: 0; padding: 14px 16px 10px; }
  .block p.sub { margin: -4px 16px 10px; font-size: 13px; color: var(--muted); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 400; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  tr:first-child td { border-top: none; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .tk { font-weight: 600; letter-spacing: 0.01em; }
  .co { color: var(--muted); font-size: 12.5px; display: block; }
  .cat { color: var(--muted); min-width: 220px; }
  .pctcell { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .mini { width: 44px; height: 4px; background: var(--line); border-radius: 2px; position: relative; overflow: hidden; flex: 0 0 auto; }
  .mini i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 2px; }
  .flag { color: var(--warn); font-size: 12.5px; }
  .na { color: var(--muted); }
  .driver-list { list-style: none; margin: 0; padding: 4px 16px 14px; }
  .driver-list li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .driver-list li:first-child { border-top: none; }
  .driver-list b { font-weight: 500; }

  .empty { padding: 0 16px 16px; color: var(--muted); font-size: 14px; }
  .criteria { border-top: 1px solid var(--line); padding: 12px 16px 14px; font-size: 13px; color: var(--muted); }
  .criteria summary { cursor: pointer; color: var(--text); }
  .criteria ul { margin: 8px 0 0; padding-left: 18px; }
  .criteria p { margin: 8px 0 0; }

  /* ---------- Footer ---------- */
  footer { border-top: 1px solid var(--line); padding: 28px 0 48px; color: var(--muted); font-size: 13px; }
  footer ul { margin: 6px 0 16px; padding-left: 18px; }
  .disclaimer { color: var(--text); }

  .error { padding: 48px 0; max-width: 60ch; }

  @media (max-width: 820px) {
    .context, .panel-grid { grid-template-columns: 1fr; }
    .frow { grid-template-columns: 1fr auto 64px; gap: 6px 10px; padding: 10px 16px; }
    .frow .fname { grid-column: 1; grid-row: 1; }
    .frow .tagwrap { grid-column: 2; grid-row: 1; }
    .frow .fpct { grid-column: 3; grid-row: 1; }
    .frow .flevel { grid-column: 1 / -1; grid-row: 2; text-align: left; }
    .frow .track { grid-column: 1 / -1; grid-row: 3; }
    .tagwrap { justify-self: end; }
    .tip { left: auto; right: 0; width: min(280px, 80vw); }
    .track::before { top: -3px; bottom: -3px; }
    .context { gap: 28px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark">Market Brief <span>daily pre-open read</span></div>
    <div class="controls">
      <span class="pill" id="session">Loading</span>
      <label for="datepick" class="sr" style="position:absolute;left:-9999px">Choose a date</label>
      <select id="datepick" aria-label="Choose a date"></select>
      <select id="theme" aria-label="Theme">
        <option value="">Auto theme</option><option value="dark">Dark</option><option value="light">Light</option>
      </select>
    </div>
  </header>
  <main id="app"></main>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const fmtPct = p => (p === null || p === undefined) ? '<span class="na">n/a</span>'
  : `<span class="${p > 0 ? "up-t" : p < 0 ? "down-t" : "flat-t"}">${p > 0 ? "+" : p < 0 ? "−" : ""}${Math.abs(p).toFixed(2)}%</span>`;
const fmtPrice = p => (p === null || p === undefined) ? '<span class="na">n/a</span>'
  : p < 1 ? p.toFixed(3) : p.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const relv = r => (r === null || r === undefined) ? '<span class="na">n/a</span>' : `${r.toFixed(1)}×`;

function pctCell(p, scale) {
  if (p === null || p === undefined) return fmtPct(p);
  const w = Math.min(100, Math.abs(p) / scale * 100);
  const col = p >= 0 ? "var(--up)" : "var(--down)";
  return `<div class="pctcell"><span class="mini" aria-hidden="true"><i style="width:${w}%;background:${col}"></i></span>${fmtPct(p)}</div>`;
}


/* Reading tags: rules of thumb, judged from the % move (or level, for VIX and yields). */
const T = (label, level, why) => ({ label, level, why });
const METRICS = [
  { test: /vix/i, about: "The VIX measures how much the S&P 500 is expected to swing over the next 30 days, priced from options. Divide by 16 for a typical one-day S&P move (VIX 16 ≈ 1%).",
    rate: (r, lvl) => {
      if (r.pct !== null && r.pct >= 10) return T("Spiking", "alert", `Up ${r.pct.toFixed(1)}% today. A jump of 10%+ in a day signals sudden nervousness.`);
      if (lvl === null) return null;
      if (lvl < 15) return T("Calm", "calm", "Below 15: investors expect small daily moves.");
      if (lvl < 20) return T("Normal", "calm", "15–20 is the usual range.");
      if (lvl < 30) return T("Elevated", "watch", "20–30: investors expect bigger swings than usual.");
      return T("High fear", "alert", "Above 30: markets are stressed and moves can be violent.");
    } },
  { test: /10y|yield/i, about: "The interest rate on 10-year US government debt. It sets borrowing costs across the economy; rising yields usually weigh on tech and small-cap stocks.",
    rate: (r, lvl) => {
      if (lvl === null) return null;
      if (lvl < 4) return T("Normal", "calm", "Below 4% is within the range of recent years.");
      if (lvl < 5) return T("Elevated", "watch", "4–5% is high by post-2008 standards and pressures stock valuations.");
      return T("High", "alert", "5%+ is the highest since the early 2000s; often the market's main worry.");
    } },
  { test: /dxy|dollar/i, about: "The US dollar against a basket of major currencies. A stronger dollar tends to weigh on gold, oil and large exporters.",
    pctBands: [0.3, 0.7] },
  { test: /wti|crude|oil/i, about: "The US oil benchmark price. Rising oil helps energy stocks but can feed inflation worries.",
    pctBands: [1, 3] },
  { test: /gold/i, about: "Gold is a safe-haven asset. Gold rising while stocks fall usually signals caution.",
    pctBands: [0.5, 1.5] },
  { test: /bitcoin|btc/i, about: "The largest cryptocurrency. It drives crypto-linked stocks and ETFs such as COIN, MSTR, CONL and MSTX.",
    pctBands: [2, 5] },
  { test: /russell/i, about: "Futures on the Russell 2000, an index of about 2,000 smaller US companies. More sensitive to interest rates than the large-cap indexes.",
    pctBands: [0.4, 1.5] },
  { test: /nasdaq/i, about: "Futures on the Nasdaq-100, the 100 largest non-financial Nasdaq companies. Heavy in tech; shows where tech is likely to open.",
    pctBands: [0.4, 1.5] },
  { test: /dow/i, about: "Futures on the Dow Jones Industrial Average, 30 large US blue-chip companies.",
    pctBands: [0.3, 1.2] },
  { test: /s&p|spx/i, about: "Futures on the S&P 500, the 500 largest US companies. The best single read on where the overall market will open.",
    pctBands: [0.3, 1.2] },
];
function rateMetric(r) {
  const m = METRICS.find(m => m.test.test(r.name));
  if (!m) return null;
  const nums = String(r.level ?? "").replace(/,/g, "").match(/\d+(\.\d+)?/g);
  const lvl = nums ? Math.max(...nums.map(Number)) : null;
  let tag;
  if (m.rate) tag = m.rate(r, lvl);
  else if (r.pct === null || r.pct === undefined) tag = null;
  else {
    const a = Math.abs(r.pct), [lo, hi] = m.pctBands;
    tag = a < lo ? T(a < lo / 3 ? "Quiet" : "Normal", "calm", `A move under ${lo}% is ordinary for this market.`)
        : a < hi ? T("Notable", "watch", `${lo}–${hi}% is a bigger move than usual; worth checking why.`)
        : T("Large move", "alert", `${hi}%+ is unusual for this market in one session.`);
  }
  return tag ? { ...tag, about: m.about } : { label: "No reading", level: "calm", why: "Not enough data to judge today.", about: m.about };
}
let tipSeq = 0;
function tagHTML(r) {
  const t = rateMetric(r);
  if (!t) return '<div class="tagwrap"></div>';
  const id = `tip-${++tipSeq}`;
  return `<div class="tagwrap"><button type="button" class="tag t-${t.level}" aria-describedby="${id}">${esc(t.label)}</button>
    <span role="tooltip" id="${id}" class="tip"><b>${esc(r.name)}</b>${esc(t.about)}<span class="why">${esc(t.why)}</span></span></div>`;
}

function zeroField(rows) {
  const max = Math.max(0.5, ...rows.filter(r => r.pct !== null).map(r => Math.abs(r.pct)));
  return rows.map(r => {
    let bar;
    if (r.pct === null || r.pct === undefined) bar = `<span class="bar na" title="${esc(r.note || "n/a")}"></span>`;
    else {
      const w = Math.max(0.6, Math.abs(r.pct) / max * 50);
      bar = `<span class="bar ${r.pct >= 0 ? "up" : "down"}" style="width:${w}%"></span>`;
    }
    return `<div class="frow">
      <div class="fname">${esc(r.name)}</div>
      <div class="flevel">${esc(r.level)}</div>
      ${tagHTML(r)}
      <div class="track" aria-hidden="true">${bar}</div>
      <div class="fpct">${fmtPct(r.pct)}</div>
    </div>`;
  }).join("");
}

function moverTable(rows, opts = {}) {
  const scale = Math.max(1, ...rows.map(r => Math.abs(r.pct ?? 0)));
  return `<div class="scroll"><table>
    <thead><tr><th>Ticker</th><th class="num">Price</th><th class="num">Change</th><th class="num">Volume</th>
    ${opts.mcap ? '<th class="num">Mkt cap</th><th class="num">Float</th>' : '<th class="num">Rel vol</th>'}
    <th>${opts.mcap ? "Catalyst / flag" : "Catalyst"}</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td><span class="tk">${esc(r.ticker)}</span><span class="co">${esc(r.company)}</span></td>
      <td class="num">${fmtPrice(r.price)}</td>
      <td class="num">${pctCell(r.pct, scale)}</td>
      <td class="num">${esc(r.volume)}</td>
      ${opts.mcap ? `<td class="num">${esc(r.mcap)}</td><td class="num na">${esc(r.float)}</td>` : `<td class="num">${relv(r.relvol)}</td>`}
      <td class="cat">${opts.mcap && r.flag ? '<span class="flag">⚠ </span>' : ""}${esc(r.note ?? r.catalyst)}</td>
    </tr>`).join("")}</tbody></table></div>`;
}


function watchlistPanel(w) {
  if (!w) return `<div class="block"><h3>Gap watchlist</h3><p class="sub">Not available for this date. The watchlist started on Oct 6, 2026.</p></div>`;
  const rows = w.items || [];
  const crit = (w.criteria || []).map(c => `<li>${esc(c)}</li>`).join("");
  const scale = Math.max(1, ...rows.map(r => Math.abs(r.gap_pct ?? 0)));
  const body = rows.length ? `<div class="scroll"><table>
    <thead><tr><th>Ticker</th><th>Direction</th><th class="num">Prior close</th><th class="num">Pre-market</th><th class="num">Gap</th><th class="num">Rel vol</th><th>Catalyst</th><th>Risk note</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td><span class="tk">${esc(r.ticker)}</span><span class="co">${esc(r.company)}</span></td>
      <td>${r.direction === "down" ? "Gap down" : "Gap up"}</td>
      <td class="num">${fmtPrice(r.prior_close)}</td>
      <td class="num">${fmtPrice(r.premarket_price)}</td>
      <td class="num">${pctCell(r.gap_pct, scale)}</td>
      <td class="num">${relv(r.relvol)}</td>
      <td class="cat">${esc(r.catalyst)}</td>
      <td class="cat">${r.risk ? '<span class="flag">⚠ </span>' + esc(r.risk) : '<span class="na">None noted</span>'}</td>
    </tr>`).join("")}</tbody></table></div>`
    : `<p class="prose empty">${esc(w.empty_reason || "No names passed the screen today.")}</p>`;
  return `<div class="block"><h3>Gap watchlist</h3>
    <p class="sub">A rules-based screen of names gapping on news before the open. It is not a recommendation to buy or sell.</p>
    ${body}
    <details class="criteria"><summary>Screen rules</summary><ul>${crit}</ul>${w.excluded ? `<p>Screened out today: ${esc(w.excluded)}</p>` : ""}</details>
  </div>`;
}

function render(d) {
  $("#session").textContent = d.session === "PRE-MARKET" ? "Pre-market" : "Regular session";
  const dateStr = new Date(d.date + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  const e = d.earnings || { before_open: [], after_close: [] };
  const earnRows = (list, when) => list.map(r => `<tr><td><span class="tk">${esc(r.ticker)}</span><span class="co">${esc(r.company)}</span></td>
    <td>${when}</td><td class="num">${esc(r.estimate)}</td><td>${esc(r.reaction)}${r.note ? `<span class="co">${esc(r.note)}</span>` : ""}</td></tr>`).join("");
  const lev = d.leveraged || [];
  const levScale = Math.max(1, ...lev.map(r => Math.abs(r.pct ?? 0)));

  $("#app").innerHTML = `
  <section class="hero" aria-labelledby="headline">
    <p class="date">${dateStr}</p>
    <h1 id="headline">${esc(d.headline)}</h1>
    <p class="asof">${esc(d.data_as_of)}</p>
    <div class="field" role="table" aria-label="Market snapshot, percent change">${zeroField(d.snapshot)}</div>
    <div class="closes">${(d.cash_close || []).map(c => `<span>${esc(c.name)} cash close <b>${esc(c.level)}</b> ${fmtPct(c.pct)}</span>`).join("")}</div>
  </section>

  <section class="context">
    <div><h2>What's driving today</h2><p class="prose">${esc(d.drivers)}</p></div>

  </footer>`;

  wireTabs();
}

function wireTabs() {
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  const select = t => {
    tabs.forEach(x => {
      const on = x === t;
      x.setAttribute("aria-selected", on); x.tabIndex = on ? 0 : -1;
      document.getElementById(x.getAttribute("aria-controls")).hidden = !on;
    });
    t.focus();
  };
  tabs.forEach((t, i) => {
    t.addEventListener("click", () => select(t));
    t.addEventListener("keydown", ev => {
      if (ev.key === "ArrowRight") select(tabs[(i + 1) % tabs.length]);
      if (ev.key === "ArrowLeft") select(tabs[(i - 1 + tabs.length) % tabs.length]);
    });
  });
}

async function load(date) {
  try {
    const res = await fetch(`data/${date}.json`, { cache: "no-store" });
    if (!res.ok) throw new Error(`No brief found for ${date}.`);
    render(await res.json());
    const u = new URL(location); u.searchParams.set("d", date); history.replaceState(null, "", u);
  } catch (err) {
    $("#app").innerHTML = `<div class="error"><h2>Couldn't load this brief</h2><p class="prose">${esc(err.message)} If you opened this file directly from disk, serve the folder instead (for example <code>python3 -m http.server</code>) or view it on GitHub Pages.</p></div>`;
  }
}

(async function init() {
  const theme = $("#theme");
  try { const t = localStorage.getItem("mb-theme"); if (t) { theme.value = t; document.documentElement.dataset.theme = t; } } catch (e) {}
  theme.addEventListener("change", () => {
    const v = theme.value;
    if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem("mb-theme", v); } catch (e) {}
  });

  let idx = { latest: null, dates: [] };
  try { idx = await (await fetch("data/index.json", { cache: "no-store" })).json(); } catch (e) {}
  const pick = $("#datepick");
  const dates = [...idx.dates].sort().reverse();
  pick.innerHTML = dates.map(d => `<option value="${d}">${new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}</option>`).join("");
  const wanted = new URLSearchParams(location.search).get("d");
  const start = dates.includes(wanted) ? wanted : (idx.latest || dates[0]);
  if (!start) { $("#app").innerHTML = '<div class="error"><h2>No briefs yet</h2><p class="prose">The first brief appears after the next weekday run.</p></div>'; return; }
  pick.value = start;
  pick.addEventListener("change", () => load(pick.value));
  load(start);
})();
</script>
